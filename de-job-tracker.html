<title>DE Job Pipeline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail of pipeline stages (nav) + working canvas; collapses to a top strip on phones. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#EAF0EE; --ink:#13201C; --muted:#5A6A64; --line:#D3DDD9;
  --accent:#0B7A66; --accent-ink:#FFFFFF; --accent-soft:#DCEFE9;
  --amber:#A85C08; --amber-soft:#FBEAD3; --good:#1D7A3A; --good-soft:#DFF2E4; --bad:#B13628; --bad-soft:#F8E0DC; --info:#2B5BA5; --info-soft:#E1EAF8;
  --shadow:0 1px 2px rgba(19,32,28,.06),0 4px 14px rgba(19,32,28,.06);
  --f-display:"Be Vietnam Pro","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#141D1A; --surface-2:#1B2622; --ink:#E3ECE8; --muted:#94A59E; --line:#283632;
  --accent:#3EC3A5; --accent-ink:#05211A; --accent-soft:#12382F;
  --amber:#EBA75B; --amber-soft:#3A2A14; --good:#5DC97C; --good-soft:#163222; --bad:#F08779; --bad-soft:#3B1C18; --info:#82A9F0; --info-soft:#18253D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#141D1A; --surface-2:#1B2622; --ink:#E3ECE8; --muted:#94A59E; --line:#283632;
  --accent:#3EC3A5; --accent-ink:#05211A; --accent-soft:#12382F;
  --amber:#EBA75B; --amber-soft:#3A2A14; --good:#5DC97C; --good-soft:#163222; --bad:#F08779; --bad-soft:#3B1C18; --info:#82A9F0; --info-soft:#18253D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:700} h2{font-size:1.2rem;font-weight:600} h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:.8rem}
.brand b{font-family:var(--f-display);display:block;line-height:1.2}
.brand span{font-size:.75rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.8rem}
.sync{display:flex;gap:8px;align-items:center;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.dot.ok{background:var(--good)}

main{padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;max-width:1240px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.head p{color:var(--muted);margin-top:4px;max-width:65ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent}
.card h3{margin-bottom:10px}
.sec{margin-top:26px}
.sec>h2{margin-bottom:12px}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.9rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn[disabled]{opacity:.55;cursor:progress}
.btn svg{width:16px;height:16px}
.ai-mark{font-family:var(--f-mono);font-size:.68rem;padding:1px 5px;border-radius:4px;background:var(--info-soft);color:var(--info);font-weight:500}
.btn.primary .ai-mark{background:rgba(255,255,255,.2);color:inherit}

input[type=text],input[type=url],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;line-height:1.5}
textarea.code{font-family:var(--f-mono);font-size:.82rem}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:500}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.8rem;background:var(--surface-2);border:1px solid transparent;white-space:nowrap}
.chip.have{background:var(--good-soft);color:var(--good)}
.snap-item{flex-wrap:wrap;row-gap:6px}
kbd{display:inline-block;min-width:1.4em;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;background:var(--card,transparent)}
.diff{font-size:12px;line-height:1.45;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px}.dl-act{float:right;padding:0 6px;min-height:0;font-size:11px;text-decoration:none}.dl{padding:1px 4px;border-radius:4px;white-space:pre-wrap;word-break:break-word}.dl-add{background:var(--good-soft);color:var(--good)}.dl-del{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.chip.miss{background:var(--bad-soft);color:var(--bad)}
.chip.nice{background:var(--amber-soft);color:var(--amber)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip button{border:0;background:none;padding:0;cursor:pointer;color:inherit;opacity:.7;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.score{font-family:var(--f-mono);font-weight:500;font-size:.8rem;padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.score.hi{background:var(--good-soft);color:var(--good)} .score.mid{background:var(--amber-soft);color:var(--amber)} .score.lo{background:var(--bad-soft);color:var(--bad)}
.tag-sample{font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:1px dashed var(--amber);padding:0 5px;border-radius:4px}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-family:var(--f-mono);font-size:1.6rem;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}

.funnel{display:flex;flex-direction:column;gap:8px}
.fun-row{display:grid;grid-template-columns:110px minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:.85rem}
.fun-bar{height:22px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.fun-bar i{display:block;height:100%;background:var(--accent);border-radius:5px;min-width:2px}
.gap-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 32px;gap:10px;align-items:center;font-size:.88rem}
.gap-row .bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.gap-row .bar i{display:block;height:100%;background:var(--amber)}

.todo{display:flex;flex-direction:column}
.todo-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.todo-item:first-child{border-top:0}
.todo-ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:.8rem;font-family:var(--f-mono)}
.todo-ico.bad{background:var(--bad-soft);color:var(--bad)} .todo-ico.amb{background:var(--amber-soft);color:var(--amber)} .todo-ico.acc{background:var(--accent-soft);color:var(--accent)}

.board-wrap{overflow-x:auto;padding-bottom:10px;margin-inline:-4px}
.board{display:grid;grid-template-columns:repeat(7,minmax(220px,1fr));gap:12px;padding:0 4px;min-width:min-content}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px;font-weight:600;font-size:.85rem}
.col-h .mono{color:var(--muted);font-weight:400}
.jcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.jcard:hover{border-color:var(--accent)}
.jcard.stale{border-left:3px solid var(--amber)}
.jcard b{font-size:.9rem;line-height:1.3}
.jcard .meta{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:.78rem;color:var(--muted)}
.due{font-size:.75rem;font-family:var(--f-mono)}
.due.over{color:var(--bad)}
.stage-pip{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}

table.list{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl>table.list{min-width:680px}
table.list th{text-align:left;font-weight:600;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line)}
table.list td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr:hover td{background:var(--surface-2);cursor:pointer}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

.matrix{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.mx{display:flex;gap:8px;align-items:center;padding:6px 9px;border-radius:7px;font-size:.85rem;background:var(--surface-2)}
.mx i{font-style:normal;font-family:var(--f-mono);font-size:.75rem;width:16px;text-align:center}
.mx.have i{color:var(--good)} .mx.miss i{color:var(--bad)} .mx.eq i{color:var(--amber)}
.mx small{margin-left:auto;color:var(--muted);font-size:.7rem}

.gauge{display:flex;gap:18px;align-items:center}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring b{width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:1.4rem;font-weight:500}

.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.prose{max-width:72ch;display:flex;flex-direction:column;gap:10px}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.prose code,.code-inline{font-family:var(--f-mono);font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 8px 8px 0;font-size:.9rem}
.callout.amb{border-color:var(--amber);background:var(--amber-soft)}
.callout.bad{border-color:var(--bad);background:var(--bad-soft)}
body:not(.show-hints) .hint{display:none!important}
.hint-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:.85rem;text-align:left}
.hint-btn:hover{background:var(--surface-2)}
.hint-btn b{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:.7rem;flex:none}
body.show-hints .hint-btn{color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty h3{color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;text-align:left;width:100%}
.steps .card b{font-family:var(--f-mono);color:var(--accent);font-size:.8rem}

.drop-zone{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;cursor:pointer;background:var(--surface);transition:border-color .15s}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);background:var(--accent-soft)}
.drop-zone input{display:none}

.rewrite{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;font-size:.88rem}
.rewrite>div{padding:10px 12px;border-radius:8px;min-width:0}
.rewrite .before{background:var(--bad-soft)} .rewrite .after{background:var(--good-soft)}
.copy{float:right}

.qa{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.qa-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.grade{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:8px;padding:12px;font-size:.9rem}

.chat{display:flex;flex-direction:column;gap:12px;min-height:280px}
.msg{max-width:80ch;padding:11px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;line-height:1.55;font-size:.93rem}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding-block:12px}
.composer textarea{min-height:48px;max-height:200px}

.modal-back{position:fixed;inset:0;background:rgba(10,18,16,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(760px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.toast{display:flex;align-items:center;gap:6px;position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:.88rem;z-index:60;max-width:min(420px,calc(100vw - 36px))}

.guide-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.level-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.level-grid .card h3{display:flex;justify-content:space-between;gap:8px}
.skillmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
details.q{border-top:1px solid var(--line);padding:10px 0}
details.q summary{cursor:pointer;font-weight:500}
details.q>div{padding-top:8px;color:var(--ink);font-size:.92rem;display:flex;flex-direction:column;gap:6px}
pre.sql{background:var(--surface-2);padding:12px;border-radius:8px;overflow-x:auto;font-family:var(--f-mono);font-size:.8rem;line-height:1.5;margin:0}

.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* Career path */
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.track{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.track:hover{border-color:var(--muted)}
.track.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.track .steps-line{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.75rem;color:var(--muted)}
.comp{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 70px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.comp:first-child{border-top:0}
.comp-name b{display:block;font-size:.92rem}
.comp-name span{font-size:.78rem;color:var(--muted)}
.lvls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.lvls button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 0;cursor:pointer;font-family:var(--f-mono);font-size:.8rem;position:relative}
.lvls button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lvls button.tgt::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--amber)}
.comp-gap{font-family:var(--f-mono);font-size:.8rem;text-align:right}
.comp-ev{grid-column:1/-1;font-size:.8rem;color:var(--muted);margin-top:-6px}
.radar-wrap{display:flex;justify-content:center}
.radar{width:100%;max-width:420px;height:auto}
.radar text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;justify-content:center;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.ms{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.ms-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:.9rem;cursor:pointer;padding:3px 0}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.week{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wk{display:flex;flex-direction:column;gap:6px}
.wk b{font-family:var(--f-mono);font-size:1.3rem;font-weight:500}
.streak{display:inline-flex;gap:3px}
.streak i{width:12px;height:12px;border-radius:3px;background:var(--surface-2);display:block}
.streak i.on{background:var(--accent)}
.offer-tbl td,.offer-tbl th{text-align:right}
.offer-tbl td:first-child,.offer-tbl th:first-child{text-align:left}

async function fileToText(file) {

    return out.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
  }
  if (name.endsWith(".docx")) { if (!window.mammoth) throw new Error("Thư viện đọc DOCX chưa tải được"); return (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value.trim(); }

}

/* Deterministic weekly report: this week vs last week + rule-based bottlenecks (no AI, no usage cost). */
function weekReport(key = wkKey()) {
  const s0 = new Date(key + "T00:00:00").getTime(), e0 = s0 + 7 * 864e5, s1 = s0 - 7 * 864e5;

    const st = weekStats(k);
    const added = state.jobs.filter(j => inW(addedAt(j), a, b)).length;
    const resp = state.jobs.filter(j => (j.history || []).some(h => ["screen", "interview", "offer"].includes(h.status) && inW(h.at, a, b))).length;
    const ivs = state.jobs.filter(j => (j.history || []).some(h => h.status === "interview" && inW(h.at, a, b))).length;
    const rej = state.jobs.filter(j => (j.history || []).some(h => h.status === "rejected" && inW(h.at, a, b))).length;
    return { ...st, added, resp, ivs, rej };
  };
  const cur = count(s0, e0, key), prev = count(s1, s0, wkKey(new Date(s1 + 3600e3))); const g = state.career.goals;

  const savedHigh = state.jobs.filter(j => j.status === "saved" && (jobScore(j) ?? 0) >= 65).length;
  const interviewing = state.jobs.filter(j => j.status === "interview").length;
  const waiting = state.jobs.filter(j => j.status === "applied" && stageDays(j) >= 7 && !j.nextDate).length;
  const notes = [];
  if (cur.apps < g.apps) notes.push(`Mới nộp ${cur.apps}/${g.apps} đơn${savedHigh ? `; còn ${savedHigh} việc phù hợp ≥ 65 chưa nộp` : ""}.`);
  if (appliedAll >= 8 && respAll / appliedAll < .1) notes.push(`Tỉ lệ phản hồi ${Math.round(respAll / appliedAll * 100)}% sau ${appliedAll} đơn: xem lại CV hoặc chọn JD phù hợp hơn.`);
  if (interviewing && cur.practice === 0) notes.push(`${interviewing} việc đang phỏng vấn nhưng tuần này chưa luyện câu nào.`);
  if (waiting) notes.push(`${waiting} đơn chờ ≥ 7 ngày chưa follow-up.`);
  if (cur.hours < g.hours / 2) notes.push(`Giờ học ${cur.hours}/${g.hours}: dưới một nửa mục tiêu.`);
  if (!notes.length) notes.push("Đúng nhịp mục tiêu. Giữ đều tuần sau.");
  return { cur, prev, notes };
}

/* Raw data viewer: exactly what is stored per record (same shape as the account store documents). */
function rawRecords() {
  const R = [];
  if (state.profile) R.push({ id: "profile", label: "Hồ sơ CV", data: { kind: "profile", ...state.profile } });
  R.push({ id: "career", label: "Lộ trình & check-in", data: { kind: "career", ...state.career } }, { id: "mentor", label: "Hội thoại mentor", data: { kind: "mentor", ...state.mentor } });
  if (state.files.length) R.push({ id: "files", label: "Danh mục file", data: { kind: "files", items: state.files } });
  state.jobs.forEach(j => R.push({ id: j.id, label: "Việc: " + (j.title || "?") + " · " + (j.company || ""), data: { kind: "job", ...j } }));
  state.cvdocs.forEach(d => R.push({ id: d.id, label: "CV: " + d.name, data: { kind: "cvdoc", ...d } }));
  state.stories.forEach(x => R.push({ id: x.id, label: "STAR: " + (x.title || "?"), data: { kind: "story", ...x } }));
  state.contacts.forEach(c => R.push({ id: c.id, label: "Liên hệ: " + c.name, data: { kind: "contact", ...c } }));
  return R;
}
function rawCard() {
  const R = rawRecords(); const id = R.some(r => r.id === state.ui.rawId) ? state.ui.rawId : R[0]?.id; const r = R.find(x => x.id === id);
  const json = r ? JSON.stringify(r.data, null, 2) : "";
  return `<details class="card sec" ${state.ui.rawOpen ? "open" : ""} id="rawBox"><summary style="cursor:pointer;font-weight:600">Xem dữ liệu thô <span class="small muted" style="font-weight:400">${R.length} bản ghi</span></summary>
    <div class="stack" style="margin-top:10px"><div class="row"><select id="rawSel" data-raw="1" style="width:auto;max-width:100%" aria-label="Chọn bản ghi">${R.map(x => `<option value="${esc(x.id)}" ${x.id === id ? "selected" : ""}>${esc(x.label)}</option>`).join("")}</select>${r ? `<span class="small muted mono">${esc(id)} · ${kb(new Blob([json]).size)}</span><button class="btn sm" data-act="copy" data-text="${esc(json)}">Chép JSON</button>` : ""}</div>
    ${r ? `<pre class="sql" style="max-height:420px;overflow:auto;white-space:pre-wrap;word-break:break-word">${esc(json)}</pre>` : '<p class="small muted">Chưa có dữ liệu.</p>'}</div></details>`;

  if (dz && e.dataTransfer.files.length) { e.preventDefault(); dz.classList.remove("over"); if (dz.id === "cvDrop") handleCVFile(e.dataTransfer.files[0]); else handleJDFiles([...e.dataTransfer.files]); }
});
document.addEventListener("dragend", () => document.querySelectorAll(".col.drop").forEach(x => x.classList.remove("drop")));

let lastErrToast = 0;
window.addEventListener("error", e => { console.error(e.error || e.message); if (Date.now() - lastErrToast > 8000) { lastErrToast = Date.now(); toast("Có lỗi nhỏ xảy ra. Dữ liệu của bạn vẫn được giữ nguyên."); } });
window.addEventListener("unhandledrejection", e => console.warn("unhandled", e.reason));

try { new MutationObserver(() => labelize($("#modal"))).observe($("#modal"), { childList: true, subtree: true }); } catch {}
/* ================= Boot ================= */
try { if (localStorage.getItem("de-hints") === "1") document.body.classList.add("show-hints"); state.ui.jobSort = localStorage.getItem("de-jobsort") || "added-desc"; } catch {}
lsLoad();
if (window.__EMBED_DATA && !hasData()) { try { applyData(window.__EMBED_DATA, false); } catch (e) { console.warn("embedded data", e); } }
normalizeState(); render();
if (window.__OFFLINE) setTimeout(() => toast("Bản offline: dữ liệu lưu trên trình duyệt này. AI và đồng bộ tài khoản không hoạt động."), 800); setSyncUI(); initCloud().then(() => { if (S.mode !== "cloud") snapshot(); setTimeout(backupReminder, 4000); }); getAI();
</script>
